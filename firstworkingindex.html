<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Multi-Category Guessing Game</title>
    <style>
        :root {
            --color-correct: #6aaa64;
            --color-partial: #c9b458;
            --color-incorrect: #787c7e;
            --color-bg: #121213;
            --color-card-bg: #1e1e1f;
            --color-text: #ffffff;
            --color-border: #3a3a3c;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--color-bg);
            color: var(--color-text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #818384;
            margin-bottom: 25px;
            font-size: 0.95rem;
            text-align: center;
        }

        .game-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Controls / Search Box */
        .search-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--color-card-bg);
            border: 2px solid var(--color-border);
            border-radius: 8px;
            color: var(--color-text);
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
        }

        .search-input:focus {
            border-color: #56a0de;
        }

        .dropdown-menu {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background-color: var(--color-card-bg);
            border: 1px solid var(--color-border);
            border-top: none;
            border-radius: 0 0 8px 8px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 10;
            display: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .dropdown-item {
            padding: 10px 16px;
            cursor: pointer;
            border-bottom: 1px solid #2a2a2b;
        }

        .dropdown-item:last-child {
            border-bottom: none;
        }

        .dropdown-item:hover {
            background-color: #2a2a2b;
        }

        /* Table Grid Design */
        .grid-header {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            font-weight: bold;
            text-align: center;
            border-bottom: 2px solid var(--color-border);
            padding-bottom: 8px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #b0b3b5;
        }

        .guesses-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 8px;
            min-height: 50px;
        }

        .guess-row {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            animation: flipIn 0.5s ease forward;
        }

        .cell {
            background-color: var(--color-card-bg);
            border: 1px solid var(--color-border);
            border-radius: 4px;
            min-height: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 5px;
            font-size: 0.95rem;
            font-weight: 600;
            box-sizing: border-box;
            word-break: break-word;
        }

        .cell.correct {
            background-color: var(--color-correct);
            border-color: var(--color-correct);
        }

        .cell.partial {
            background-color: var(--color-partial);
            border-color: var(--color-partial);
        }

        .cell.incorrect {
            background-color: var(--color-incorrect);
            border-color: var(--color-incorrect);
        }

        .arrow {
            font-size: 1.2rem;
            margin-top: 2px;
        }

        .game-status {
            text-align: center;
            font-size: 1.3rem;
            font-weight: bold;
            margin-top: 15px;
            min-height: 30px;
        }

        .reset-btn {
            display: block;
            margin: 15px auto 0 auto;
            padding: 10px 20px;
            background-color: #56a0de;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            display: none;
        }

        .reset-btn:hover {
            background-color: #428bca;
        }

        @keyframes flipIn {
            0% { transform: rotateX(-90deg); opacity: 0; }
            100% { transform: rotateX(0deg); opacity: 1; }
        }

        /* Mobile Responsive adjustments */
        @media (max-width: 600px) {
            body { padding: 10px; }
            .grid-header { font-size: 0.7rem; gap: 4px; }
            .guess-row { gap: 4px; }
            .cell { font-size: 0.75rem; min-height: 50px; padding: 2px; }
            .arrow { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <h1>Category Wordle</h1>
    <div class="subtitle">Guess the mystery item based on its attributes!</div>

    <div class="game-container">
        <!-- Search & Filter Dropdown Area -->
        <div class="search-container">
            <input type="text" id="searchBox" class="search-input" placeholder="Type or click to search items..." autocomplete="off">
            <div id="dropdownMenu" class="dropdown-menu"></div>
        </div>

        <!-- Feedback Messages -->
        <div id="gameStatus" class="game-status"></div>
        <button id="resetBtn" class="reset-btn">Play Again</button>

        <!-- Game Board Grid -->
        <div>
            <div class="grid-header">
                <div>Category 1<br>(Text)</div>
                <div>Category 2<br>(Number)</div>
                <div>Category 3<br>(Text)</div>
                <div>Category 4<br>(Text)</div>
                <div>Category 5<br>(Multi / Split)</div>
                <div>Category 6<br>(Number)</div>
            </div>
            <div id="guessesContainer" class="guesses-container">
                <!-- Rows will be injected here dynamically via JavaScript -->
            </div>
        </div>
    </div>

    <script>
        // --- DATASET CONFIGURATION ---
        // Change these options to fit your specific game topic (e.g., Pokémon, Sports Players, Countries, Cars).
        const itemPool = [
            { name: "Alpha Item",   cat1: "Red",    cat2: 150,  cat3: "West",  cat4: "Solid",  cat5: "Fire/Flying/Dragon", cat6: 2010 },
            { name: "Beta Item",    cat1: "Blue",   cat2: 85,   cat3: "East",  cat4: "Liquid", cat5: "Water/Ice",          cat6: 2015 },
            { name: "Gamma Item",   cat1: "Green",  cat2: 210,  cat3: "North", cat4: "Gas",    cat5: "Grass/Poison/Water", cat6: 2008 },
            { name: "Delta Item",   cat1: "Red",    cat2: 120,  cat3: "South", cat4: "Solid",  cat5: "Electric/Steel",     cat6: 2022 },
            { name: "Epsilon Item", cat1: "Yellow", cat2: 45,   cat3: "West",  cat4: "Liquid", cat5: "Flying/Electric",    cat6: 1999 },
            { name: "Zeta Item",    cat1: "Blue",   cat2: 300,  cat3: "North", cat4: "Solid",  cat5: "Dragon/Fire/Rock",   cat6: 2026 }
        ];

        let secretItem = null;
        let guessedItems = [];
        let gameOver = false;

        // --- DOM ELEMENTS ---
        const searchBox = document.getElementById("searchBox");
        const dropdownMenu = document.getElementById("dropdownMenu");
        const guessesContainer = document.getElementById("guessesContainer");
        const gameStatus = document.getElementById("gameStatus");
        const resetBtn = document.getElementById("resetBtn");

        // Initialize / Start Game
        function initGame() {
            // Select a random target item
            secretItem = itemPool[Math.floor(Math.random() * itemPool.length)];
            guessedItems = [];
            gameOver = false;
            
            // Clear UI elements
            guessesContainer.innerHTML = "";
            gameStatus.innerHTML = "";
            searchBox.value = "";
            searchBox.disabled = false;
            resetBtn.style.display = "none";
            
            // Console logging answer for easier developer testing
            console.log("Secret Target Answer:", secretItem.name);
        }

        // --- DROPDOWN & FILTER LOGIC ---
        function showDropdown() {
            if (gameOver) return;
            const filterText = searchBox.value.toLowerCase();
            dropdownMenu.innerHTML = "";

            // Filter item pool based on search input and exclude already guessed choices
            const filtered = itemPool.filter(item => 
                item.name.toLowerCase().includes(filterText) && !guessedItems.includes(item.name)
            );

            if (filtered.length === 0) {
                dropdownMenu.style.display = "none";
                return;
            }

            filtered.forEach(item => {
                const div = document.createElement("div");
                div.className = "dropdown-item";
                div.textContent = item.name;
                div.addEventListener("click", () => {
                    submitGuess(item);
                    dropdownMenu.style.display = "none";
                    searchBox.value = "";
                });
                dropdownMenu.appendChild(div);
            });

            dropdownMenu.style.display = "block";
        }

        // Event listeners for searching
        searchBox.addEventListener("input", showDropdown);
        searchBox.addEventListener("focus", showDropdown);

        // Close dropdown when clicking outside
        document.addEventListener("click", (e) => {
            if (!searchBox.contains(e.target) && !dropdownMenu.contains(e.target)) {
                dropdownMenu.style.display = "none";
            }
        });

        // --- GUESS EVALUATION LOGIC ---
        function submitGuess(guessedItem) {
            guessedItems.push(guessedItem.name);
            
            const row = document.createElement("div");
            row.className = "guess-row";

            // Category 1: Standard Text Match
            createCell(row, guessedItem.cat1, secretItem.cat1, "text");

            // Category 2: Number Match with High/Low Indicator Arrows
            createCell(row, guessedItem.cat2, secretItem.cat2, "number");

            // Category 3: Standard Text Match
            createCell(row, guessedItem.cat3, secretItem.cat3, "text");

            // Category 4: Standard Text Match
            createCell(row, guessedItem.cat4, secretItem.cat4, "text");

            // Category 5: Multi-Value "/" Split Partial Match Evaluation
            createCell(row, guessedItem.cat5, secretItem.cat5, "multi");

            // Category 6: Number Match with High/Low Indicator Arrows
            createCell(row, guessedItem.cat6, secretItem.cat6, "number");

            guessesContainer.appendChild(row);

            // Win / Lose evaluation check
            if (guessedItem.name === secretItem.name) {
                gameStatus.textContent = "🎉 Congratulations! You guessed correctly!";
                gameStatus.style.color = "var(--color-correct)";
                endGame();
            } else if (guessedItems.length >= 6) {
                gameStatus.textContent = `😢 Game over! The correct answer was: ${secretItem.name}`;
                gameStatus.style.color = "#ff4d4d";
                endGame();
            }
        }

        // Build individual cells dynamically checking formatting match types
        function createCell(rowElement, guessVal, correctVal, type) {
            const cell = document.createElement("div");
            cell.className = "cell";

            if (type === "text") {
                cell.textContent = guessVal;
                if (guessVal === correctVal) {
                    cell.classList.add("correct");
                } else {
                    cell.classList.add("incorrect");
                }
            } 
            else if (type === "number") {
                cell.textContent = guessVal;
                if (guessVal === correctVal) {
                    cell.classList.add("correct");
                } else {
                    cell.classList.add("incorrect");
                    const arrowSpan = document.createElement("span");
                    arrowSpan.className = "arrow";
                    // Arrow points UP if correct value is higher than guess value, otherwise DOWN
                    arrowSpan.textContent = correctVal > guessVal ? " ⬆️" : " ⬇️";
                    cell.appendChild(arrowSpan);
                }
            } 
            else if (type === "multi") {
                cell.textContent = guessVal;
                
                if (guessVal === correctVal) {
                    cell.classList.add("correct");
                } else {
                    // Extract items by separating via the forward slash delimiter
                    const guessParts = guessVal.split("/").map(s => s.trim().toLowerCase());
                    const correctParts = correctVal.split("/").map(s => s.trim().toLowerCase());
                    
                    // Check if there is an overlapping partial value match present
                    const hasOverlap = guessParts.some(part => correctParts.includes(part));
                    
                    if (hasOverlap) {
                        cell.classList.add("partial");
                    } else {
                        cell.classList.add("incorrect");
                    }
                }
            }

            rowElement.appendChild(cell);
        }

        function endGame() {
            gameOver = true;
            searchBox.disabled = true;
            resetBtn.style.display = "block";
        }

        resetBtn.addEventListener("click", initGame);

        // Run game logic on startup initialization
        initGame();
    </script>
</body>
</html>
