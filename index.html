<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Wordle Game</title>
    <style>
        :root {
            --color-correct: #6aaa64;
            --color-partial: #c9b458;
            --color-incorrect: #787c7e;
            --color-bg: #121213;
            --color-surface: #1a1a1b;
            --color-text: #ffffff;
            --color-border: #3a3a3c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--color-bg);
            color: var(--color-text);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            margin-bottom: 20px;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .game-container {
            width: 100%;
            max-width: 1500px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Search Dropdown Section */
        .search-section {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--color-surface);
            border: 2px solid var(--color-border);
            border-radius: 8px;
            color: var(--color-text);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: #56a0de;
        }

        .dropdown-menu {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background-color: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: 0 0 8px 8px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 10;
            display: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .dropdown-item {
            padding: 10px 16px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .dropdown-item:hover {
            background-color: var(--color-border);
        }

        /* Grid Headers */
        .grid-header {
            display: grid;
            grid-template-columns: 80px 1fr 1fr 1fr 1fr 1fr 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            text-align: center;
        }

        /* Grid Row Layout */
        .guess-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .guess-row {
            display: grid;
            grid-template-columns: 80px 1fr 1fr 1fr 1fr 1fr 1fr 1fr 1fr;
            gap: 8px;
        }

        .cell {
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: var(--color-surface);
            border: 2px solid var(--color-border);
            font-weight: bold;
            font-size: 0.95rem;
            text-align: center;
            padding: 4px;
            border-radius: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            word-break: break-word;
        }

        .cell.image-cell {
        grid-column: span 1;
        aspect-ratio: auto; /* Dissolves the 1:1 squishing constraint */
        height: 100%;       /* Ensures it fills the row height */
    }

        .cell img {
        width: 100%;
        height: 100%;
    /* Prevents the image from distorting while filling the cell completely */
        object-fit: cover; 
        border-radius: 2px;
}

        .cell.correct {
            background-color: var(--color-correct);
            border-color: var(--color-correct);
        }

        .cell.partial {
            background-color: var(--color-partial);
            border-color: var(--color-partial);
        }

        .cell.incorrect {
            background-color: var(--color-incorrect);
            border-color: var(--color-incorrect);
        }

        .arrow {
            font-size: 0.8rem;
            margin-top: 2px;
        }

        .win-message {
            display: none;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--color-correct);
            margin: 20px 0;
        }
    </style>
</head>

        // System randomly picks a winning target item
        const targetSolution = itemPool[Math.floor(Math.random() * itemPool.length)];
        
        // Element references
        const searchInput = document.getElementById('searchInput');
        const dropdownMenu = document.getElementById('dropdownMenu');
        const guessGrid = document.getElementById('guessGrid');
        const winMessage = document.getElementById('winMessage');

        let remainingItems = [...itemPool];
        let gameOver = false;

        // Render Dropdown options filtering dynamically
        function updateDropdown(filterText) {
            dropdownMenu.innerHTML = '';
            if (!filterText || gameOver) {
                dropdownMenu.style.display = 'none';
                return;
            }

            const cleanFilter = filterText.toLowerCase();
            const matched = remainingItems.filter(item => item[1].toLowerCase().includes(cleanFilter));

            if (matched.length === 0) {
                dropdownMenu.style.display = 'none';
                return;
            }

            matched.forEach(item => {
                const div = document.createElement('div');
                div.className = 'dropdown-item';
                div.textContent = item[1]; // Use item name
                div.addEventListener('click', () => {
                    handleGuess(item);
                    searchInput.value = '';
                    dropdownMenu.style.display = 'none';
                });
                dropdownMenu.appendChild(div);
            });

            dropdownMenu.style.display = 'block';
        }

        // Processing a valid choice selection
        function handleGuess(guessItem) {
            // Remove guessed item from subsequent dropdown lists
            remainingItems = remainingItems.filter(item => item[1] !== guessItem[1]);

            const row = document.createElement('div');
            row.className = 'guess-row';

            // 0. Image Slot Box
            const imgCell = document.createElement('div');
            imgCell.className = 'cell image-cell';
            const img = document.createElement('img');
            img.src = guessItem[0];
            img.alt = guessItem[1];
            imgCell.appendChild(img);
            row.appendChild(imgCell);

            // Process columns sequentially: 1 (Name), 2 (New Text), 3 (Cat1), 4 (Cat2 #), 5 (Cat3), 6 (Cat4 /), 7 (Cat5 #)
            for (let i = 1; i < guessItem.length; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                
                const guessVal = guessItem[i];
                const targetVal = targetSolution[i];

                cell.textContent = guessVal;

                // Absolute string equality check
               // 1. FIRST: Handle text formatting based on the column index
                if (guessVal === targetVal) {
                    cell.classList.add('correct');
                    if (i === 8) {
                        const arcWords = {
                        1: "Introduction Arc",
                        2: "Temp Arc 2",
                        3: "Temp Arc 3"
                        // Add more numbers and words here as needed!
                            
                        };
                cell.textContent = arcWords[guessVal] || guessVal;
                }
                } 
                // Number check with directions indicators (for indices 4 and 7)
                else if (i === 4 || i === 7) {
                    cell.classList.add('incorrect');
                    const arrowSpan = document.createElement('span');
                    arrowSpan.className = 'arrow';
                    arrowSpan.textContent = guessVal < targetVal ? " ⬆️" : " ⬇️";
                    cell.appendChild(arrowSpan);
                } 
                    // Custom Word Replacement + Arrow Calculation for Column 8
                    else if (i === 8) {
                        cell.classList.add('incorrect');

                        // 1. Map your numbers to custom words
                        const arcWords = {
                        1: "Introduction Arc",
                        2: "Temp Arc 2",
                        3: "Temp Arc 3"
        // Add more numbers and words here as needed!
                        };

    // 2. Change the cell text to the word (defaults to the number if not listed above)
    cell.textContent = arcWords[guessVal] || guessVal;

    // 3. The math still runs on the numbers, so the correct arrow is added right next to the word
    const arrowSpan = document.createElement('span');
    arrowSpan.className = 'arrow';
    arrowSpan.textContent = guessVal < targetVal ? " ⬆️" : " ⬇️";
    cell.appendChild(arrowSpan);
}
                // Delimited values split check (for index 6)
                else if (i === 6) {
                    const guessParts = String(guessVal).split('/');
                    const targetParts = String(targetVal).split('/');
                    const hasOverlap = guessParts.some(part => targetParts.includes(part));
                    
                    if (hasOverlap) {
                        cell.classList.add('partial');
                    } else {
                        cell.classList.add('incorrect');
                    }
                } 
                // Standard un-matched strings
                else {
                    cell.classList.add('incorrect');
                }

                row.appendChild(cell);
            }

            guessGrid.appendChild(row);

            // Win evaluation check
            if (guessItem[1] === targetSolution[1]) {
                gameOver = true;
                winMessage.style.display = 'block';
                searchInput.disabled = true;
            }
        }

        // Operational Event Listeners
        searchInput.addEventListener('input', (e) => updateDropdown(e.target.value));

        // Click outside closes dropdown menu
        document.addEventListener('click', (e) => {
            if (!searchInput.contains(e.target) && !dropdownMenu.contains(e.target)) {
                dropdownMenu.style.display = 'none';
            }
        });
