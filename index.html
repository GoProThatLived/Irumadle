<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Wordle Game</title>
    <style>
        :root {
            --color-correct: #6aaa64;
            --color-partial: #c9b458;
            --color-incorrect: #787c7e;
            --color-bg: #121213;
            --color-surface: #1a1a1b;
            --color-text: #ffffff;
            --color-border: #3a3a3c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--color-bg);
            color: var(--color-text);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            margin-bottom: 20px;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .game-container {
            width: 100%;
            max-width: 1100px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Search Dropdown Section */
        .search-section {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--color-surface);
            border: 2px solid var(--color-border);
            border-radius: 8px;
            color: var(--color-text);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: #56a0de;
        }

        .dropdown-menu {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background-color: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: 0 0 8px 8px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 10;
            display: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .dropdown-item {
            padding: 10px 16px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .dropdown-item:hover {
            background-color: var(--color-border);
        }

        /* Grid Headers adjusted for 9 columns total */
        .grid-header {
            display: grid;
            grid-template-columns: 60px 1fr 1fr 1fr 1fr 1fr 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            text-align: center;
        }

        /* Grid Row Layout adjusted for 9 columns total */
        .guess-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .guess-row {
            display: grid;
            grid-template-columns: 60px 1fr 1fr 1fr 1fr 1fr 1fr 1fr 1fr;
            gap: 8px;
        }

        .cell {
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: var(--color-surface);
            border: 2px solid var(--color-border);
            font-weight: bold;
            font-size: 0.95rem;
            text-align: center;
            padding: 4px;
            border-radius: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            word-break: break-word;
        }

        .cell.image-cell {
            padding: 0;
            background-color: transparent;
            border-color: transparent;
        }

        .cell img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 4px;
        }

        .cell.correct {
            background-color: var(--color-correct);
            border-color: var(--color-correct);
        }

        .cell.partial {
            background-color: var(--color-partial);
            border-color: var(--color-partial);
        }

        .cell.incorrect {
            background-color: var(--color-incorrect);
            border-color: var(--color-incorrect);
        }

        .arrow {
            font-size: 0.8rem;
            margin-top: 2px;
        }

        .win-message {
            display: none;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--color-correct);
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <header>
        <h1>Category Wordle</h1>
    </header>

    <div class="game-container">
        <!-- Search Section -->
        <div class="search-section">
            <input type="text" id="searchInput" class="search-input" placeholder="Search and guess...">
            <div id="dropdownMenu" class="dropdown-menu"></div>
        </div>

        <div id="winMessage" class="win-message">🎉 You guessed it right! 🎉</div>

        <!-- Guess Grid Area -->
        <div>
            <!-- Grid Column Headers -->
            <div class="grid-header">
                <div></div>
                <div>Name</div>
                <div>Race</div>
                <div>Hair Color</div>
                <div>Age</div>
                <div>Bloodline Magic</div>
                <div>Affiliation</div>
                <div>Rank</div>
                <div>Introduction Arc</div>
            </div>
            
            <div id="guessGrid" class="guess-grid">
                <!-- User guesses will be dynamically appended here -->
            </div>
        </div>
    </div>

    <script>
        // Number to Word Mapping Helper Table (Expand up to 50 as needed)
        const arcNumberToWord = {
            1: "One",
            2: "Two",
            3: "Three",
            4: "Four",
            5: "Five",
            6: "Six",
            7: "Seven",
            8: "Eight",
            9: "Nine",
            10: "Ten",
            11: "Eleven",
            12: "Twelve",
            13: "Thirteen",
            14: "Fourteen",
            15: "Fifteen",
            // ... Add mappings easily all the way up to 50 here
            50: "Fifty"
        };

        // Sample Pool of Items
        // New Layout Mapping index: 
        // [0: ImageURL, 1: TargetName, 2: NewTextVal, 3: Cat1Val, 4: Cat2Num, 5: Cat3Val, 6: Cat4Delimited, 7: Cat5Num, 8: IntroductionArcNum]
        const itemPool = [
            ["https://picsum.photos", "Suzuki Iruma", "Human", "Blue", 15, "No", "Sullivan Family/Babyls", 5.5, 1],
            ["https://picsum.photos", "Asmodeus Alice", "Demon", "Pink", 15, "No", "Asmodeus Family/Babyls", 5, 2],
            ["https://picsum.photos", "Valac Clara", "Deity", "Green", 14, "Yes", "Babyls/Valac Family", 4, 1],
            ["https://picsum.photos", "Shiida", "Artificial Demon", "Yellow", 25, "No", "The Six Fingers", 0, 14],
            ["https://picsum.photos", "Ameri Azazel", "Demoness", "Red", 16, "Yes", "Demon Border Patrol/Student Council/Babyls", 7, 3]
        ];

        // System randomly picks a winning target item
        const targetSolution = itemPool[Math.floor(Math.random() * itemPool.length)];
        
        // Element references
        const searchInput = document.getElementById('searchInput');
        const dropdownMenu = document.getElementById('dropdownMenu');
        const guessGrid = document.getElementById('guessGrid');
        const winMessage = document.getElementById('winMessage');

        let remainingItems = [...itemPool];
        let gameOver = false;

        // Render Dropdown options filtering dynamically
        function updateDropdown(filterText) {
            dropdownMenu.innerHTML = '';
            if (!filterText || gameOver) {
                dropdownMenu.style.display = 'none';
                return;
            }

            const cleanFilter = filterText.toLowerCase();
            const matched = remainingItems.filter(item => item[1].toLowerCase().includes(cleanFilter));

            if (matched.length === 0) {
                dropdownMenu.style.display = 'none';
                return;
            }

            matched.forEach(item => {
                const div = document.createElement('div');
                div.className = 'dropdown-item';
                div.textContent = item[1]; // Use item name
                div.addEventListener('click', () => {
                    handleGuess(item);
                    searchInput.value = '';
                    dropdownMenu.style.display = 'none';
                });
                dropdownMenu.appendChild(div);
            });

            dropdownMenu.style.display = 'block';
        }

        // Processing a valid choice selection
        function handleGuess(guessItem) {
            // Remove guessed item from subsequent dropdown lists
            remainingItems = remainingItems.filter(item => item[1] !== guessItem[1]);

            const row = document.createElement('div');
            row.className = 'guess-row';

            // 0. Image Slot Box
            const imgCell = document.createElement('div');
            imgCell.className = 'cell image-cell';
            const img = document.createElement('img');
            img.src = guessItem[0];
            img.alt = guessItem[1];
            imgCell.appendChild(img);
            row.appendChild(imgCell);
