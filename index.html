<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Wordle Game</title>
    <style>
        :root {
            --color-correct: #6aaa64;
            --color-partial: #c9b458;
            --color-incorrect: #787c7e;
            --color-bg: #121213;
            --color-surface: #1a1a1b;
            --color-text: #ffffff;
            --color-border: #3a3a3c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--color-bg);
            color: var(--color-text);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            margin-bottom: 20px;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .game-container {
            width: 100%;
            max-width: 1500px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Search Dropdown Section */
        .search-section {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--color-surface);
            border: 2px solid var(--color-border);
            border-radius: 8px;
            color: var(--color-text);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: #56a0de;
        }

        .dropdown-menu {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background-color: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: 0 0 8px 8px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 10;
            display: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .dropdown-item {
            padding: 10px 16px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .dropdown-item:hover {
            background-color: var(--color-border);
        }

        /* Grid Headers */
        .grid-header {
            display: grid;
            grid-template-columns: 80px 1fr 1fr 1fr 1fr 1fr 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            text-align: center;
        }

        /* Grid Row Layout */
        .guess-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .guess-row {
            display: grid;
            grid-template-columns: 80px 1fr 1fr 1fr 1fr 1fr 1fr 1fr 1fr;
            gap: 8px;
        }

        .cell {
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: var(--color-surface);
            border: 2px solid var(--color-border);
            font-weight: bold;
            font-size: 0.95rem;
            text-align: center;
            padding: 4px;
            border-radius: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            word-break: break-word;
            white-space: pre-line;
        }

        .cell.image-cell {
        grid-column: span 1;
        aspect-ratio: auto; /* Dissolves the 1:1 squishing constraint */
        height: 100%;       /* Ensures it fills the row height */
    }

        .cell img {
        width: 100%;
        height: 100%;
    /* Prevents the image from distorting while filling the cell completely */
        object-fit: cover; 
        border-radius: 2px;
}

        .cell.correct {
            background-color: var(--color-correct);
            border-color: var(--color-correct);
        }

        .cell.partial {
            background-color: var(--color-partial);
            border-color: var(--color-partial);
        }

        .cell.incorrect {
            background-color: var(--color-incorrect);
            border-color: var(--color-incorrect);
        }

        .arrow {
            font-size: 0.8rem;
            margin-top: 2px;
        }

        .win-message {
            display: none;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--color-correct);
            margin: 20px 0;
        }
    </style>
</head>
