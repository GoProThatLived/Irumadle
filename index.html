<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Babyls Character Wordle</title>
    <style>
        :root {
            --correct: #2ecc71;
            --partial: #f1c40f;
            --incorrect: #e74c3c;
            --bg-dark: #121214;
            --panel-dark: #1f1f23;
            --text-light: #ffffff;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .game-container {
            width: 100%;
            max-width: 900px;
        }

        /* Dashboard Styles */
        .dashboard {
            background: var(--panel-dark);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .stats-row { display: flex; gap: 20px; }
        .mode-control { display: flex; align-items: center; gap: 10px; }

        /* Toggle Switch Styling */
        .switch { position: relative; display: inline-block; width: 44px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .3s; border-radius: 22px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #9b59b6; }
        input:checked + .slider:before { transform: translateX(22px); }
        .hidden { display: none !important; }
        button { background: #9b59b6; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold;}

        /* Search & Autocomplete List */
        .search-container { position: relative; margin-bottom: 25px; }
        .input-wrapper { position: relative; width: 100%; }
        #char-search { width: 100%; padding: 12px; box-sizing: border-box; border-radius: 6px; border: 1px solid #444; background: #2a2a30; color: white; font-size: 16px; }
        .dropdown-content { position: absolute; width: 100%; max-height: 200px; overflow-y: auto; background: #2a2a30; border: 1px solid #444; z-index: 10; border-radius: 0 0 6px 6px; }
        .dropdown-item { padding: 10px; display: flex; align-items: center; gap: 15px; cursor: pointer; border-bottom: 1px solid #3a3a40; }
        .dropdown-item:hover { background: #3a3a40; }
        .avatar { width: 36px; height: 36px; border-radius: 4px; object-fit: cover; background: #555; }

        /* Grid Output Display */
        .grid-header, .guess-row {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 8px;
            text-align: center;
            align-items: center;
            margin-bottom: 8px;
        }
        .grid-header { font-weight: bold; border-bottom: 2px solid #444; padding-bottom: 8px; font-size: 14px; }
        .tile {
            background: #2a2a30;
            min-height: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 600;
            padding: 4px;
            box-sizing: border-box;
            word-break: break-word;
        }
        .tile img { width: 100%; height: 52px; object-fit: cover; border-radius: 2px; }

        /* Feedback Statuses */
        .correct { background-color: var(--correct); }
        .partial { background-color: var(--partial); color: black; }
        .incorrect { background-color: var(--incorrect); }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- Top Dashboard Box -->
        <div class="dashboard">
            <div class="stats-row">
                <div>Daily Streak: <span id="played-streak">0</span> days</div>
                <div>Win Streak: <span id="win-streak">0</span> days</div>
                <div>Total Wins: <span id="total-wins">0</span></div>
            </div>
            <div class="mode-control">
                <label class="switch">
                    <input type="checkbox" id="mode-toggle">
                    <span class="slider round"></span>
                </label>
                <span id="mode-label">Daily Mode</span>
                <button id="next-btn" class="hidden">Next Character 🔄</button>
            </div>
        </div>

        <!-- Search Bar with Custom Dropdown -->
        <div class="search-container">
            <div class="input-wrapper">
                <input type="text" id="char-search" placeholder="Type a character name...">
                <div id="dropdown-list" class="dropdown-content hidden"></div>
            </div>
        </div>

        <!-- Grid Header Columns -->
        <div class="grid-header">
            <div>Picture</div>
            <div>Name</div>
            <div>Age</div>
            <div>Race</div>
            <div>Hair Color</div>
            <div>Bloodline</div>
            <div>Affiliation</div>
            <div>Rank</div>
        </div>

        <!-- Guesses Feed Container -->
        <div id="guesses-container"></div>
    </div>

    <script>
        const characters = [
            { id: 1, name: "Suzuki Iruma", age: 15, race: "Human", hairColor: "Blue", bloodlineMagic: "No", affiliation: "Sullivan Family/Babyls/Abnormal Class", rank: 5, pic: "https://placehold.co" },
            { id: 2, name: "Asmodeus Alice", age: 15, race: "Demon", hairColor: "Pink", bloodlineMagic: "Yes", affiliation: "Babyls/Abnormal Class/Student Council", rank: 5, pic: "https://placehold.co" },
            { id: 3, name: "Valac Clara", age: 15, race: "Demoness", hairColor: "Green", bloodlineMagic: "Yes", affiliation: "Babyls/Abnormal Class/Valac Family", rank: 4, pic: "https://placehold.co" },
            { id: 4, name: "Azazel Ameri", age: 17, race: "Demoness", hairColor: "Orange", bloodlineMagic: "Yes", affiliation: "Babyls/Student Council", rank: 6, pic: "https://placehold.co" },
            { id: 5, name: "Naberius Kalego", age: "Unknown", race: "Demon", hairColor: "Purple", bloodlineMagic: "Yes", affiliation: "Babyls/Faculty", rank: 8, pic: "https://placehold.co" }
        ];

        let currentAnswer = null;
        let isInfiniteMode = false;
        let gameData = JSON.parse(localStorage.getItem('irumaWordleData')) || { lastPlayedDate: "", lastWinDate: "", playedStreak: 0, winStreak: 0, totalWins: 0 };
        
        const searchInput = document.getElementById('char-search');
        const dropdown = document.getElementById('dropdown-list');
        const guessesContainer = document.getElementById('guesses-container');
        const modeToggle = document.getElementById('mode-toggle');
        const modeLabel = document.getElementById('mode-label');
        const nextBtn = document.getElementById('next-btn');

        window.addEventListener('DOMContentLoaded', () => {
            updateStatsDisplay();
            setupGameMode();
            setupSearchAutocomplete();
            
            modeToggle.addEventListener('change', (e) => {
                isInfiniteMode = e.target.checked;
                modeLabel.textContent = isInfiniteMode ? "Infinite Mode" : "Daily Mode";
                nextBtn.classList.toggle('hidden', !isInfiniteMode);
                resetBoardLayout();
                setupGameMode();
            });
            
            nextBtn.addEventListener('click', () => {
                if(isInfiniteMode) {
                    resetBoardLayout();
                    currentAnswer = characters[Math.floor(Math.random() * characters.length)];
                }
            });
        });

        function setupGameMode() {
            if (isInfiniteMode) {
                currentAnswer = characters[Math.floor(Math.random() * characters.length)];
            } else {
                const todayStr = new Date().toDateString();
                let seed = 0;
                for (let i = 0; i < todayStr.length; i++) { seed += todayStr.charCodeAt(i); }
                const pseudoRandomIdx = Math.floor(Math.abs(Math.sin(seed)) * characters.length);
                currentAnswer = characters[pseudoRandomIdx];
                checkDailyStreakValidation();
            }
        }

        function setupSearchAutocomplete() {
            searchInput.addEventListener('input', (e) => {
                const value = e.target.value.toLowerCase().trim();
                if (!value) { dropdown.classList.add('hidden'); return; }
                
                const startsWithMatches = characters.filter(c => c.name.toLowerCase().startsWith(value));
                const containsMatches = characters.filter(c => !c.name.toLowerCase().startsWith(value) && c.name.toLowerCase().includes(value));
                const filtered = [...startsWithMatches, ...containsMatches];
                
                dropdown.innerHTML = "";
                if(filtered.length > 0) {
                    dropdown.classList.remove('hidden');
                    filtered.forEach(char => {
                        const item = document.createElement('div');
                        item.className = 'dropdown-item';
                        item.innerHTML = `<img class="avatar" src="${char.pic}" alt=""> <span>${char.name}</span>`;
                        item.addEventListener('click', () => {
                            handleGuessSubmission(char);
